[package]
name = "kaydet-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "kaydet_core_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
crc32fast = "1"
chrono = "0.4"
rand = "0.8"
aes-gcm = "0.10"
scrypt = "0.11"
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }

[features]
python = ["pyo3"]
default = []

[dev-dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
