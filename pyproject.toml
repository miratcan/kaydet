[tool.uv.workspace]
members = ["packages/core", "packages/cli", "packages/server"]

[tool.uv.sources]
kaydet-core = {workspace = true}
kaydet-cli = {workspace = true}
kaydet-server = {workspace = true}

[tool.uv]
dev-dependencies = [
    "pre-commit==4.0.1",
    "ruff==0.6.1",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "mcp>=0.9.0",
    "rich>=13.0",
    "cryptography>=41.0",
    "kaydet-core",
    "kaydet-cli",
    "kaydet-server",
]

[tool.ruff]
line-length = 79
target-version = "py310"
src = ["packages/*/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["kaydet_core", "kaydet_cli", "kaydet_server"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
