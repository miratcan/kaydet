<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kaydet — Mirat Can Bayrak</title>
  <meta name="description" content="Terminal note-taking for developers. Capture work logs, ideas, and structured metadata in plain text. Search everything with SQLite FTS.">
  <style>
    :root {
      --bg: #0a0c09;
      --fg: #e8dcc8;
      --accent: #F4B942;
      --fg-muted: #998763;
      --surface: #15180f;
      --surface-strong: #1d2018;
      --border: #2d3028;
      --radius: 0px;
      --fs: 1.1rem;
      --lh: 1.8rem;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      font-size: var(--fs);
      line-height: var(--lh);
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: color-mix(in srgb, var(--accent) 65%, var(--fg)); text-decoration: underline; }
    ::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); color: var(--fg); }
    .wrapper { max-width: 79ch; margin: 0 auto; padding: 0 1.2rem; }
    header {
      background: color-mix(in srgb, var(--bg) 88%, var(--fg));
      border-bottom: 1px solid var(--border);
    }
    header nav { padding: 0.9rem 0; }
    header nav .wrapper { display: flex; flex-wrap: wrap; gap: 0.75rem 1.5rem; align-items: center; }
    header nav a { color: var(--fg); font-weight: 500; letter-spacing: 0.03em; padding-bottom: 0.35rem; }
    header nav a span { color: var(--accent); }
    header nav a.active { color: var(--accent); }
    main { margin: 0 auto; padding: 3.5rem 0 4rem; }
    h1 { font-size: clamp(2.1rem, 2.2vw + 1.5rem, 2.5rem); line-height: 1.35; letter-spacing: 0.035em; text-align: center; text-transform: uppercase; margin-bottom: 0.5rem; color: #f5f0e5; }
    h1 span { color: var(--accent); }
    .subtitle { text-align: center; color: var(--fg-muted); margin-bottom: 2rem; font-size: 1rem; }
    .demo { text-align: center; margin: 2rem 0 3rem; }
    .demo img { max-width: 100%; border: 1px solid var(--border); display: block; margin: 0 auto; }
    .install-block { text-align: center; margin: 2rem 0; }
    .install-block code { display: inline-block; background: var(--surface); border: 1px solid var(--border); padding: 0.75rem 1.5rem; font-family: "JetBrains Mono", "Fira Code", monospace; font-size: 0.95rem; color: var(--accent); }
    .links { text-align: center; color: var(--fg-muted); font-size: 0.9rem; margin-top: 3rem; }
    .links a { color: var(--accent); }
    @media (max-width: 600px) { main { padding: 2rem 0; } }
  </style>
</head>
<body>
  <header>
    <nav>
      <div class="wrapper">
        <a href="https://mirat.dev/"><span>H</span>ome</a>
        <a href="https://mirat.dev/articles/"><span>A</span>rticles</a>
        <a href="https://mirat.dev/projects/"><span>P</span>rojects</a>
        <a class="active" href="/kaydet/"><span>K</span>aydet</a>
        <a href="https://mirat.dev/resume/"><span>R</span>esume</a>
      </div>
    </nav>
  </header>
  <main>
    <div class="wrapper">
      <h1>kay<span>det</span></h1>
      <p class="subtitle">Terminal note-taking for developers. Never lose a solution twice.</p>

      <div class="demo">
        <img src="../assets/demo.gif" alt="Kaydet demo" width="720">
      </div>

      <div class="install-block">
        <code>pip install kaydet</code>
      </div>

      <div class="links">
        <a href="https://github.com/miratcan/kaydet">GitHub</a>
        &nbsp;&middot;&nbsp;
        <a href="https://github.com/miratcan/kaydet#install">Install</a>
        &nbsp;&middot;&nbsp;
        <a href="https://github.com/miratcan/kaydet/blob/master/docs/QUERY_SYNTAX.md">Query syntax</a>
      </div>
    </div>
  </main>
</body>
</html>
