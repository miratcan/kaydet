[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaydet-core"
version = "0.36.0"
description = "Core library for Kaydet personal database."
authors = [{name = "Mirat Can Bayrak"}]
license-files = ["../../LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=41.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
