[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaydet"
version = "0.38.0"
description = "Kaydet — personal daily log. CLI, MCP server, sync."
authors = [{name = "Mirat Can Bayrak"}]
license-files = ["../../LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "qrcode>=8.2",
    "rich>=13.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=0.9.0",
]

[project.scripts]
kaydet     = "kaydet_cli.cli:main"
kaydet-mcp = "kaydet_server.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
